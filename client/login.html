<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>SmartNotes — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#07090f;--card:#0d1117;--card2:#111827;--border:#1f2937;--accent:#3b82f6;--accent2:#8b5cf6;--text:#f1f5f9;--muted:#64748b;--r:12px}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:grid;grid-template-columns:1fr 1fr;-webkit-font-smoothing:antialiased}
body::after{content:'';position:fixed;width:600px;height:600px;background:radial-gradient(circle,rgba(139,92,246,.06) 0%,transparent 65%);bottom:-200px;right:-200px;border-radius:50%;pointer-events:none}
.L{background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;justify-content:space-between;padding:52px;overflow:hidden;position:relative}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(139,92,246,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(139,92,246,.025) 1px,transparent 1px);background-size:48px 48px}
.brand{display:flex;align-items:center;gap:12px;z-index:1}
.bmark{width:42px;height:42px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:12px;display:grid;place-items:center;font-size:20px;box-shadow:0 8px 32px rgba(59,130,246,.3)}
.bname{font-family:'Playfair Display',serif;font-size:22px}
.hero{z-index:1}
.badge{display:inline-flex;align-items:center;gap:8px;background:rgba(139,92,246,.08);border:1px solid rgba(139,92,246,.18);border-radius:30px;padding:7px 16px;font-size:11px;color:#a78bfa;text-transform:uppercase;letter-spacing:1px;margin-bottom:28px}
.dot{width:6px;height:6px;background:#a78bfa;border-radius:50%;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
h1{font-family:'Playfair Display',serif;font-size:clamp(36px,3.5vw,54px);line-height:1.08;margin-bottom:22px;letter-spacing:-.5px}
h1 em{font-style:italic;background:linear-gradient(135deg,var(--accent2),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sub{color:var(--muted);font-size:15px;font-weight:300;line-height:1.8;max-width:340px}
.feats{display:flex;flex-direction:column;gap:12px;z-index:1}
.feat{display:flex;align-items:center;gap:14px;padding:15px 18px;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:10px;font-size:13.5px;color:var(--muted);transition:all .25s}
.feat:hover{border-color:rgba(139,92,246,.3);color:var(--text)}
.fi{width:34px;height:34px;background:rgba(139,92,246,.1);border-radius:8px;display:grid;place-items:center;font-size:16px;flex-shrink:0}
.R{display:flex;align-items:center;justify-content:center;padding:52px 44px}
.box{width:100%;max-width:400px}
.fhead{margin-bottom:32px}
.fhead h2{font-family:'Playfair Display',serif;font-size:30px;margin-bottom:8px}
.fhead p{color:var(--muted);font-size:14px}
.fhead a{color:var(--accent);text-decoration:none;font-weight:500}
.fhead a:hover{text-decoration:underline}
.field{margin-bottom:16px}
.field label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.field input{width:100%;background:var(--card2);border:1.5px solid var(--border);border-radius:var(--r);padding:13px 16px;font-family:'Outfit',sans-serif;font-size:14px;color:var(--text);outline:none;transition:all .2s}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(59,130,246,.08);background:var(--card)}
.field input::placeholder{color:#374151}
.al{padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none}
.al.show{display:block;animation:fd .2s ease}
.al.err{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);color:#fca5a5}
.al.ok{background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.2);color:#6ee7b7}
.btn{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:var(--r);padding:14px;font-family:'Outfit',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;margin-top:4px}
.btn:hover{opacity:.9;transform:translateY(-1px);box-shadow:0 8px 24px rgba(59,130,246,.3)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
@keyframes fd{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:768px){body{grid-template-columns:1fr}.L{display:none}.R{padding:40px 24px}}
</style>
</head>
<body>
<div class="L">
  <div class="grid-bg"></div>
  <div class="brand"><div class="bmark">📝</div><span class="bname">SmartNotes</span></div>
  <div class="hero">
    <div class="badge"><span class="dot"></span>Welcome back</div>
    <h1>Your notes<br/>are waiting<br/><em>for you.</em></h1>
    <p class="sub">Sign in to access your private workspace. Everything is exactly where you left it.</p>
  </div>
  <div class="feats">
    <div class="feat"><div class="fi">🛡️</div>Secure JWT session — 7 days</div>
    <div class="feat"><div class="fi">🔒</div>bcrypt password protection</div>
    <div class="feat"><div class="fi">📱</div>Works on all devices</div>
  </div>
</div>
<div class="R">
  <div class="box">
    <div class="fhead">
      <h2>Sign in</h2>
      <p>No account yet? <a href="index.html">Sign up free</a></p>
    </div>
    <div class="al err" id="ea"></div>
    <div class="al ok" id="oa"></div>
    <div class="field"><label>Email Address</label><input id="email" type="email" placeholder="hiten@example.com" autocomplete="off"/></div>
    <div class="field"><label>Password</label><input id="password" type="password" placeholder="Your password"/></div>
    <button class="btn" id="btn" onclick="go()">Sign In →</button>
  </div>
</div>
<script>
const API='https://smart-notes-backend-af5z.onrender.com/api';
function err(m){const e=document.getElementById('ea');e.textContent=m;e.className='al err show';document.getElementById('oa').className='al ok'}
function ok(m){const e=document.getElementById('oa');e.textContent=m;e.className='al ok show';document.getElementById('ea').className='al err'}
if(localStorage.getItem('token'))window.location.href='dashboard.html';
document.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
async function go(){
  const email=document.getElementById('email').value.trim();
  const pass=document.getElementById('password').value;
  const btn=document.getElementById('btn');
  if(!email)return err('Please enter your email.');
  if(!pass)return err('Please enter your password.');
  btn.disabled=true;btn.textContent='Signing in...';
  try{
    const res=await fetch(`${API}/auth/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})});
    const d=await res.json();
    if(!res.ok)return err(d.message||'Login failed. Try again.');
    localStorage.setItem('token',d.token);
    localStorage.setItem('userEmail',email);
    // decode name from token if available
    try{
      const payload=JSON.parse(atob(d.token.split('.')[1]));
      if(payload.name)localStorage.setItem('userName',payload.name);
    }catch(_){}
    ok('Login successful! Redirecting...');
    setTimeout(()=>window.location.href='dashboard.html',900);
  }catch(e){err('Cannot reach server. Make sure backend is running on port 5000.');}
  finally{btn.disabled=false;btn.textContent='Sign In →';}
}
</script>
</body>
</html>
